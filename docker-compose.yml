# Quick start: Fotobogen behind Caddy, for a server with nothing on it but Docker.
#
#   mkdir -p data                 # so the data directory belongs to you, not root
#   cp .env.sample .env           # then set DOMAIN (leave it unset to try it on localhost)
#   docker compose up -d
#   docker compose logs app       # shows the setup token
#
# Update with: docker compose pull && docker compose up -d

services:
  app:
    image: ghcr.io/cschweda/fotobogen:latest
    # build: .                    # uncomment to build the image locally instead
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TRUST_PROXY: "1"            # Caddy is the only thing that talks to the app
      # Upload limits. If you raise MAX_UPLOAD_MB, raise the proxy's body limit to match.
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      MAX_MEGAPIXELS: "${MAX_MEGAPIXELS:-100}"
      # Passed through from .env when set there; empty means "not set".
      # The site's proper address, used wherever a full address is written out.
      SITE_URL: "${SITE_URL:-}"
      # 1 lets anyone log in as demo / demo to look round the admin, read-only.
      DEMO_MODE: "${DEMO_MODE:-}"
      # 1 lets webhooks call addresses on your own network.
      WEBHOOKS_ALLOW_PRIVATE: "${WEBHOOKS_ALLOW_PRIVATE:-}"
    volumes:
      - ./data:/data
    expose:
      - "5150"

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Wait for the app: it creates ./data/derivatives as your user. If Caddy
    # started first, Docker would create that directory as root.
    depends_on:
      app:
        condition: service_healthy
    environment:
      # With DOMAIN set, Caddy obtains a certificate and serves HTTPS.
      # Without it, the site is plain HTTP on localhost.
      SITE_ADDRESS: "${DOMAIN:-http://localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/derivatives:/srv/derivatives:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
