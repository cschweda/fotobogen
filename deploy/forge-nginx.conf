# Fotobogen behind nginx: Laravel Forge, or any bare-metal install.
#
# Paste these blocks inside the site's `server { ... }` block, replacing the
# default `location / { ... }`. In Forge: Site > Edit Files > Edit Nginx
# Configuration. Change the two paths marked below to match your site.

# Matches the app's upload limit (DESIGN.md section 6).
client_max_body_size 50m;

# Resized photos are served straight from disk. Their file names contain a
# content hash, so they can be cached forever. A file that is not there yet
# falls through to the app.
location /media/ {
    alias /home/forge/photos.example.com/data/derivatives/;   # <- your site's data directory
    try_files $uri @fotobogen;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
}

location / {
    try_files /dev/null @fotobogen;
}

location @fotobogen {
    proxy_pass http://127.0.0.1:5150;                          # <- the PORT you chose
    proxy_http_version 1.1;
    # The app compares Origin with Host, and takes the visitor's address
    # from the last X-Forwarded-For entry, so pass all of these through.
    proxy_set_header Host $http_host;   # includes the port, which the Origin check compares
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
