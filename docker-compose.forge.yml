# Laravel Forge: the app only, behind the nginx that Forge already runs.
# Forge's nginx owns ports 80 and 443 and manages the certificate; see
# deploy/forge-nginx.conf for the server block and the README for the steps.
#
# Run from the Forge site directory, as the forge user:
#   mkdir -p data
#   PUID=$(id -u) PGID=$(id -g) docker compose -f docker-compose.forge.yml up -d

services:
  app:
    image: ghcr.io/cschweda/fotobogen:latest
    # build: .                    # uncomment to build the image locally instead
    restart: unless-stopped
    # Run as the forge user so host nginx can read data/derivatives directly.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TRUST_PROXY: "1"
      # Upload limits. If you raise MAX_UPLOAD_MB, raise the proxy's body limit to match.
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      MAX_MEGAPIXELS: "${MAX_MEGAPIXELS:-100}"
      # Passed through from .env when set there; empty means "not set".
      # The site's proper address, used wherever a full address is written out.
      SITE_URL: "${SITE_URL:-}"
      # 1 lets anyone log in as demo / demo to look round the admin, read-only.
      DEMO_MODE: "${DEMO_MODE:-}"
      # 1 lets webhooks call addresses on your own network.
      WEBHOOKS_ALLOW_PRIVATE: "${WEBHOOKS_ALLOW_PRIVATE:-}"
    volumes:
      - ./data:/data
    ports:
      # Local interface only; never published to the internet.
      - "127.0.0.1:${PORT:-5150}:5150"
