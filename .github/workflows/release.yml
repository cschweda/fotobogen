# Builds the Docker image and publishes it to GitHub Container Registry
# when a version tag (v1.2.3) is pushed. Installers pull this image, so
# nobody has to build Nuxt on a small server.
#
# The image is built for Intel (amd64) and ARM (arm64) machines. Each is
# built on a runner of its own kind. It used to be built on one Intel runner,
# emulating ARM, and the emulated build of 1.1.0 hung for six hours until
# GitHub cancelled it. A build that takes longer than 30 minutes now stops.
#
# Run by hand ("Run workflow", or `gh workflow run release.yml`):
#   - with no tag: builds both without publishing anything, to check that
#     the image still builds;
#   - with a tag (`-f tag=v1.1.0`): builds that tag and publishes it, for a
#     release whose own run failed.
name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A version tag to build and publish (v1.2.3). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The tag being released: the one pushed, or the one named when run by hand. Empty means "build only".
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check the tag is a version
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "\"$RELEASE_TAG\" is not a version tag like v1.2.3"; exit 1; }
      - uses: actions/checkout@v4
        with:
          # The tag's own files, whichever way the run was started.
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # A tag: build and push this platform's image by its digest; the "publish"
      # job below gathers the two under the version's names.
      - id: build
        if: env.RELEASE_TAG != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # Run by hand with no tag: build only, publish nothing.
      - if: env.RELEASE_TAG == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Note this platform's digest
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    if: github.event_name == 'push' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            # `latest` moves only on full releases, not on tags like v1.0.0-rc.1
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
      - name: Publish both platforms under the version's names
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Show what was published
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
